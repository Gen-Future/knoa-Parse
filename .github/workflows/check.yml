name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Runtime, documents and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        features: ['--extra api', '--extra api --extra documents']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.10
      - run: uv sync --locked ${{ matrix.features }}
      - run: uv run --no-sync python scripts/check.py
      - run: uv run --no-sync python scripts/audit_dependencies.py ${{ contains(matrix.features, 'documents') && '--documents' || '' }} --api
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: git diff --check
